name: Verify Waypoint
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  workflow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: waypoint_test
          POSTGRES_USER: waypoint
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U waypoint -d waypoint_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check frontend/app.js && node --check frontend/sw.js
      - run: python tests/postgres-smoke.py
        env:
          TEST_DATABASE_URL: postgresql://waypoint:test-only@localhost:5432/waypoint_test
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait
      - run: curl --fail http://localhost:8000/api/health
      - run: docker compose down
        if: always()
